---
name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Run tests
        uses: mindersec/minder-action/test@v1.1.0
        with:
          minder_version: v0.2.2
          rules_directory: rule-types
